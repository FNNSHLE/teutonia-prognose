/* ================= Tokens (Designkonzept 2.1 bis 2.6) ================= */
:root {
  --bg-0: #F4F4F6; --bg-1: #FFFFFF; --bg-2: #EEEFF2; --bg-3: #E3E4E8;
  --tafel: #0E0F12; --scrim: rgba(11, 12, 14, .40);
  --text-1: #0B0C0E; --text-2: #5E6068; --text-3: #6B6E76; --text-on-accent: #FFFFFF;
  --line-1: #E6E7EB; --line-2: #D3D4DA; --line-ui: #8E9099;
  --accent: #3548E8; --accent-tint: #EBEDFD;
  --sieg: #16A34A; --sieg-text: #0B7A3E; --sieg-tint: #E6F4EC;
  --remis: #878A93;
  --niederlage: #E5484D; --niederlage-text: #C8262C; --niederlage-tint: #FCEBEC;
  --neutral-heim: #3A3C42; --neutral-gast: #B4B6BD;
  --seq-1: #EEF0FF; --seq-2: #D6DBFF; --seq-3: #AEB7FF; --seq-4: #7F8DFF; --seq-5: #4A5CF0; --seq-6: #2B3BC7;
  --seq-5-text: #FFFFFF; --seq-6-text: #FFFFFF;
  --glas: rgba(244, 244, 246, .88); --glas-bar: rgba(255, 255, 255, .88);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;

  --r-xs: 4px; --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 22px; --r-full: 999px;
  --shadow-float: 0 0 0 .5px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12);
  --shadow-thumb: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.18);
  --t-fast: 120ms; --t-base: 200ms; --t-slow: 320ms; --t-draw: 600ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-sheet: cubic-bezier(.32, .72, 0, 1);

  --rand: 16px; --pad: 16px; --gap: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg-0: #0B0C0E; --bg-1: #141518; --bg-2: #1C1D21; --bg-3: #26272C; --tafel: #17181C; --scrim: rgba(0,0,0,.60);
  --text-1: #F2F3F5; --text-2: #A2A5AD; --text-3: #6F727A; --text-on-accent: #0B0C0E;
  --line-1: #24252A; --line-2: #33353B; --line-ui: #6F727A;
  --accent: #8593FF; --accent-tint: #1E2242;
  --sieg: #32D16C; --sieg-text: #32D16C; --sieg-tint: #13281C; --remis: #6F727A;
  --niederlage: #FF6B6F; --niederlage-text: #FF6B6F; --niederlage-tint: #2E1719;
  --neutral-heim: #D9DBE0; --neutral-gast: #5A5D65;
  --seq-1: #1A1D33; --seq-2: #20264D; --seq-3: #2B3573; --seq-4: #3A47A3; --seq-5: #6574F0; --seq-6: #9AA5FF;
  --seq-5-text: #0B0C0E; --seq-6-text: #0B0C0E;
  --shadow-float: 0 0 0 1px #2C2D33; --shadow-thumb: 0 0 0 .5px rgba(0,0,0,.4);
  --glas: rgba(11, 12, 14, .88); --glas-bar: rgba(20, 21, 24, .88);
  color-scheme: dark;
} }
@media (min-width: 600px) { :root { --rand: 24px; --pad: 20px; --gap: 16px; } }
@media (min-width: 900px) { :root { --rand: 40px; --pad: 24px; --gap: 24px; } }

/* ================= Basis ================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg-0); color: var(--text-1);
  font: 400 15px/22px var(--font); letter-spacing: -.005em;
  font-feature-settings: "tnum" 1, "cv11" 1; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.k { width: 16px; height: 16px; stroke-width: 1.5; }

.micro { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.cap { font-size: 12px; line-height: 16px; }
.meta { font-size: 13px; line-height: 18px; color: var(--text-2); }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.titel { font: 600 17px/22px var(--font-display); letter-spacing: -.012em; margin: 0; }
.h1 { font: 700 28px/32px var(--font-display); letter-spacing: -.022em; margin: 0; }
.kpi { font: 650 28px/32px var(--font-display); letter-spacing: -.02em; }
.pz { font-size: .45em; font-weight: 600; color: var(--text-2); margin-left: .1em; vertical-align: .95em; letter-spacing: 0; line-height: 0; }
.plus { color: var(--sieg-text); } .minus { color: var(--niederlage-text); }

/* ================= Gerüst ================= */
.kopf {
  position: sticky; top: 0; z-index: 20; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) calc(var(--rand) - 4px) 0;
  display: flex; align-items: center; gap: 8px;
  background: var(--glas); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line-1);
}
.kopf .platz { flex: 1; }
.wechsler { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px; border: 0; background: none; font-weight: 600; min-width: 0; border-radius: var(--r-m); }
.wechsler span.n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wechsler .ico { color: var(--text-2); }
.icobtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--text-2); border-radius: var(--r-m); flex: none; }
.icobtn:active { background: var(--bg-2); }

.inhalt { padding: 12px var(--rand) calc(56px + env(safe-area-inset-bottom) + 32px); max-width: 1120px; min-width: 0; }
.seitenkopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
.seitenkopf .meta { margin-top: 4px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--glas-bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--line-1);
}
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-2); font-size: 11px; line-height: 14px; font-weight: 500; }
@media (min-width: 380px) { .tabbar button { font-size: 12px; } }
.tabbar button.an { color: var(--accent); }
.seitenleiste { display: none; }

@media (min-width: 900px) {
  .tabbar, .kopf { display: none; }
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .seitenleiste { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 12px 12px 16px; background: var(--bg-0); border-right: 1px solid var(--line-1); }
  .seitenleiste .wechsler { width: 100%; height: 64px; padding: 0 10px; text-align: left; gap: 12px; }
  .seitenleiste .wechsler:hover { background: var(--bg-2); }
  .seitenleiste .wechsler small { display: block; font-weight: 400; font-size: 13px; line-height: 18px; color: var(--text-2); }
  .seitenleiste .wechsler .txt { flex: 1; min-width: 0; }
  .seitenleiste nav { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .seitenleiste nav button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; background: none; border-radius: var(--r-s); font-weight: 500; color: var(--text-1); text-align: left; }
  .seitenleiste nav button:hover { background: var(--bg-2); }
  .seitenleiste nav button.an { background: var(--accent-tint); color: var(--accent); }
  .seitenleiste nav button .ico { width: 16px; height: 16px; stroke-width: 1.5; color: var(--text-2); }
  .seitenleiste nav button.an .ico { color: var(--accent); }
  .seitenleiste nav .luecke { height: 16px; }
  .seitenleiste .erfassen-knopf { width: 100%; margin: 8px 0 12px; justify-content: flex-start; padding: 0 12px; }
  .seitenleiste .fuss { margin-top: auto; padding: 0 10px; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .inhalt { padding: 32px var(--rand) 64px; }
  .seitenkopf { margin: 0 0 32px; }
}

/* ================= Komponenten ================= */
.modul { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: var(--r-l); padding: var(--pad); margin-bottom: var(--gap); min-width: 0; }
.mkopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.mkopf .micro { display: block; margin-bottom: 4px; }
.fussnote { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 12px; }
.textaktion { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 500; padding: 0; min-height: 44px; margin: -12px 0; white-space: nowrap; }
.zwei-sp { display: grid; gap: var(--gap); margin-bottom: var(--gap); align-items: start; }
.zwei-sp > * { margin-bottom: 0 !important; min-width: 0; }
@media (min-width: 900px) { .zwei-sp { grid-template-columns: 1fr 1fr; } }

/* Hero-Tafel: in beiden Modi dunkel */
.tafel {
  --text-1: #F2F3F5; --text-2: #A2A5AD; --text-3: #8B8E96; --sieg: #32D16C; --sieg-text: #32D16C; --remis: #6F727A;
  --niederlage: #FF6B6F; --niederlage-text: #FF6B6F; --accent: #8593FF; --text-on-accent: #0B0C0E; --line-1: #2A2B30;
  --neutral-heim: #D9DBE0; --neutral-gast: #5A5D65;
  color-scheme: dark; background: var(--tafel); color: var(--text-1); border-radius: var(--r-xl); padding: 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06); position: relative; overflow: hidden; min-width: 0;
}
.tafel::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 100% 0%, rgba(133,147,255,.10), transparent 60%); pointer-events: none; }
.tafel > * { position: relative; }
.tafel .zone-a { display: flex; justify-content: space-between; align-items: center; min-height: 20px; gap: 8px; }
.tafel .zone-a .micro { color: var(--text-2); }
.tafel .count { font-size: 12px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-full); background: rgba(255,255,255,.08); color: var(--text-1); white-space: nowrap; }
.tafel .count.heute { background: var(--accent); color: var(--text-on-accent); }
.tafel .termin { margin-top: 8px; font-size: 13px; line-height: 18px; font-weight: 500; }
.tafel .halle { font-size: 13px; line-height: 18px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tafel .paarung { display: grid; grid-template-columns: 1fr 48px 1fr; align-items: start; margin-top: 20px; text-align: center; border: 0; background: none; width: 100%; padding: 0; color: inherit; }
.tafel .paarung .nm { font-weight: 600; margin-top: 8px; line-height: 20px; }
.tafel .paarung .pl { font-size: 12px; line-height: 16px; color: var(--text-2); margin-top: 2px; }
.tafel .paarung .fstrich { width: 16px; height: 2px; background: var(--accent); margin: 6px auto 0; border-radius: 1px; }
.tafel .paarung .vs { font-size: 12px; color: var(--text-3); padding-top: 16px; }
.tafel .zahl { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; gap: 12px; }
.tafel .hero { font: 700 64px/60px var(--font-display); letter-spacing: -.04em; font-variant-numeric: proportional-nums; white-space: nowrap; }
.tafel .zahl .lab { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 6px; }
.tafel .neben { text-align: right; font-size: 13px; line-height: 20px; color: var(--text-2); padding-bottom: 24px; }
.tafel .neben b { color: var(--text-1); font-weight: 600; }
.tafel .streifen { margin-top: 12px; }
.tafel .erw { margin-top: 10px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.tafel .aktionen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
.btn { height: 44px; border-radius: var(--r-m); border: 0; padding: 0 16px; font-weight: 600; background: var(--bg-2); color: var(--text-1); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform var(--t-fast), background var(--t-fast); white-space: nowrap; }
.btn:active { transform: scale(.985); }
.btn.prim { background: var(--accent); color: var(--text-on-accent); }
.tafel .btn:not(.prim) { background: rgba(255,255,255,.08); color: var(--text-1); }
.hero-raster { display: grid; gap: var(--gap); margin-bottom: var(--gap); }
@media (min-width: 900px) {
  .tafel { padding: 32px; }
  .tafel .kern { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: end; }
  .tafel .zahl { margin-top: 0; }
  .tafel .hero { font-size: 88px; line-height: 80px; }
  .hero-raster { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .hero-raster .kacheln { margin-bottom: 0; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
}

/* Ausgangsstreifen */
.streifen { display: flex; gap: 2px; height: 8px; border-radius: var(--r-full); overflow: hidden; }
.streifen.d { height: 4px; }
.streifen i { display: block; min-width: 3px; }
.streifen .s { background: var(--sieg); } .streifen .u { background: var(--remis); } .streifen .n { background: var(--niederlage); }
.streifen .h { background: var(--neutral-heim); } .streifen .g { background: var(--neutral-gast); }

/* Kennzahl-Kacheln */
.kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-bottom: var(--gap); }
@media (min-width: 900px) { .kacheln.vier { grid-template-columns: repeat(4, 1fr); } }
.kachel { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: var(--r-l); padding: 16px; min-height: 96px; min-width: 0; display: flex; flex-direction: column; }
.kachel .lab { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }
.kachel .kpi { margin-top: 8px; display: flex; align-items: baseline; gap: 6px; }
.kachel .ctx { font-size: 12px; line-height: 16px; color: var(--text-2); margin-top: auto; padding-top: 4px; }
.kachel .delta { font-size: 13px; font-weight: 600; letter-spacing: 0; }

/* Logo-Kachel mit Monogramm */
.logo { position: relative; display: inline-grid; place-items: center; flex: none; background: #FFFFFF; border-radius: 22%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; vertical-align: middle; }
.logo .mono { font-weight: 600; color: #5E6068; font-size: 40%; line-height: 1; letter-spacing: 0; }
.logo img { position: absolute; inset: 10%; width: 80%; height: 80%; object-fit: contain; opacity: 0; transition: opacity var(--t-fast); }
.logo img.da { opacity: 1; }
/* Spielerinnen: Foto nur fürs eigene Team (Zustimmung), sonst Initialen */
.ava { position: relative; display: inline-grid; place-items: center; flex: none; border-radius: 50%; background: var(--bg-2); color: var(--text-2); overflow: hidden; vertical-align: middle; font-weight: 600; letter-spacing: 0; line-height: 1; box-shadow: inset 0 0 0 1px var(--line-1); }
.ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--t-fast); }
.ava img.da { opacity: 1; }
.a24 { width: 24px; height: 24px; font-size: 10px; } .a28 { width: 28px; height: 28px; font-size: 11px; } .a32 { width: 32px; height: 32px; font-size: 12px; }
.a40 { width: 40px; height: 40px; font-size: 14px; } .a96 { width: 96px; height: 96px; font-size: 30px; } .a72 { width: 72px; height: 72px; font-size: 24px; }
.l16 { width: 16px; height: 16px; font-size: 16px; } .l20 { width: 20px; height: 20px; font-size: 20px; } .l24 { width: 24px; height: 24px; font-size: 24px; }
.l28 { width: 28px; height: 28px; font-size: 28px; } .l48 { width: 48px; height: 48px; font-size: 48px; }
@media (min-width: 900px) { .tafel .l48 { width: 56px; height: 56px; font-size: 56px; } }

/* Etiketten, Chips, Segmented */
.etikett { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-xs); font-size: 12px; font-weight: 500; background: var(--bg-2); color: var(--text-2); white-space: nowrap; vertical-align: middle; letter-spacing: 0; }
.etikett.kontur { background: none; box-shadow: inset 0 0 0 1px var(--line-ui); }
.chipreihe { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 calc(-1 * var(--rand)) var(--gap); padding: 0 var(--rand) 2px; scrollbar-width: none; }
.chipreihe::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: var(--r-full); border: 0; background: var(--bg-2); color: var(--text-1); font-size: 13px; font-weight: 500; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip.an { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.chip:active { background: var(--bg-3); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 40px; padding: 2px; background: var(--bg-2); border-radius: var(--r-m); margin-bottom: var(--gap); }
.seg button { position: relative; z-index: 1; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--text-2); border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.seg button.an { color: var(--text-1); background: var(--bg-1); box-shadow: var(--shadow-thumb); }
@media (prefers-color-scheme: dark) { .seg button.an { background: var(--bg-3); } }
@media (min-width: 900px) { .seg { height: 32px; max-width: 420px; } }
.mini-seg { display: inline-grid; grid-template-columns: repeat(3, 44px); height: 32px; padding: 2px; background: var(--bg-2); border-radius: var(--r-s); flex: none; }
.mini-seg button { border: 0; background: none; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.mini-seg button.an { background: var(--text-1); color: var(--bg-1); }

/* Spielzeile */
.zeilen { margin: 0 calc(-1 * var(--pad)); }
.spiel { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 10px var(--pad); border: 0; background: none; width: 100%; text-align: left; color: inherit; transition: background var(--t-fast); }
.spiel + .spiel::before { content: ""; position: absolute; top: 0; left: var(--pad); right: 0; height: 1px; background: var(--line-1); }
.spiel:active { background: var(--bg-2); }
.spiel.fokus::after { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 32px; margin-top: -16px; background: var(--accent); border-radius: 0 2px 2px 0; }
.spiel .wt { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.spiel .tg { font-size: 13px; line-height: 18px; font-weight: 500; }
.spiel .paar { display: grid; gap: 4px; min-width: 0; }
.spiel .paar div { display: flex; align-items: center; gap: 8px; min-width: 0; height: 20px; }
.spiel .paar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spiel .paar .sieger { font-weight: 600; } .spiel .paar .verl { color: var(--text-2); }

.sun { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--r-xs); font-size: 12px; font-weight: 700; color: #fff; flex: none; letter-spacing: 0; }

.sun.gross { width: 28px; height: 28px; font-size: 13px; border-radius: 6px; }
.treffer { width: 14px; height: 14px; color: var(--text-3); }
.spieltag { position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 2; height: 32px; display: flex; align-items: center; padding: 0 var(--pad); margin: 0 calc(-1 * var(--pad)); background: var(--bg-1); border-bottom: 1px solid var(--line-1); }

.tab th.l, .tab td.l { text-align: left; }
.tab .team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tab .team span { overflow: hidden; text-overflow: ellipsis; }
.tab td.tw { max-width: 170px; }
.tab tr.f td { background: var(--accent-tint); }
.tab tr.f td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

.scrollx { overflow-x: auto; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); -webkit-overflow-scrolling: touch; }
.scrollx .tab td:first-child, .scrollx .tab th:first-child { position: sticky; left: calc(-1 * var(--pad)); background: var(--bg-1); z-index: 1; }
.scrollx .tab tr.f td:first-child { background: var(--accent-tint); }
.heat td.z { width: 34px; min-width: 34px; padding: 0; text-align: center; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--bg-1); }

/* Empfehlungen */
.karten { display: grid; gap: var(--gap); margin-bottom: var(--gap); }
@media (min-width: 900px) { .karten.zwei { grid-template-columns: 1fr 1fr; } }
.karte { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: var(--r-l); padding: 16px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; color: inherit; min-width: 0; }
.karte .eff .kpi { display: block; }
.karte .eff .kpi.gut { color: var(--sieg-text); }
.karte .eff small { display: block; font-size: 12px; line-height: 14px; color: var(--text-2); margin-top: 4px; }
.karte .spur { height: 4px; width: 64px; background: var(--bg-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.karte .spur i { display: block; height: 100%; background: var(--sieg); border-radius: 2px; }
.karte h3 { font: 600 17px/22px var(--font-display); letter-spacing: -.012em; margin: 4px 0 6px; }

.karte .belege { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* Spielerinnen-Zeilen mit Schalter */
.sz { position: relative; display: grid; grid-template-columns: 44px 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 56px; padding: 6px var(--pad); }
.sz + .sz::before { content: ""; position: absolute; top: 0; left: calc(var(--pad) + 52px); right: 0; height: 1px; background: var(--line-1); }

.sz .wer { min-width: 0; }
.sz .wer b { font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }

.sz .regelzeile { grid-column: 2 / -1; padding-bottom: 6px; }
.sz .pinbtn { border: 0; background: none; padding: 0; color: var(--text-3); height: 20px; }
.sz .pinbtn.an .etikett { background: var(--text-1); color: var(--bg-1); }
.schalter { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--bg-3); box-shadow: inset 0 0 0 1px var(--line-ui); position: relative; margin: 0; cursor: pointer; transition: background var(--t-base); flex: none; }
.schalter::before { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: var(--shadow-thumb); transition: transform var(--t-base) var(--ease-out); }

.nur-mobil { display: inline; }
@media (max-width: 599px) { .sz .wer b .etikett { display: none; } }
.sheet .griff { display: none !important; }
@media (min-width: 600px) { .nur-mobil { display: none; } }
.listenkopf { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--pad); min-height: 36px; }

/* Regler */

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; --f0: 50%; --f1: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--bg-3) var(--f0), var(--accent) var(--f0), var(--accent) var(--f1), var(--bg-3) var(--f1)); }

input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: #FFFFFF; box-shadow: var(--shadow-thumb); transition: transform var(--t-fast); }

input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }

/* Labor */
.labor-leiste { position: sticky; top: calc(52px + env(safe-area-inset-top) + 8px); z-index: 5; }
@media (min-width: 900px) { .labor-leiste { top: 16px; } }
.ergebnis3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 8px; margin: 4px 0 12px; }
.ergebnis3 .w { font: 650 28px/32px var(--font-display); letter-spacing: -.02em; white-space: nowrap; }
.ergebnis3 .lab { font-size: 12px; line-height: 16px; color: var(--text-2); }
.ergebnis3 .d { font-size: 13px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }

/* Hinweisleiste */
.hinweis { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; background: var(--bg-2); border-radius: var(--r-m); font-size: 13px; line-height: 18px; margin-bottom: var(--gap); }
.hinweis .ico { color: var(--text-2); width: 16px; height: 16px; stroke-width: 1.5; }
.hinweis .textaktion { margin: -12px 0 -12px auto; }

.satz { padding: 12px 0; border-top: 1px solid var(--line-1); }
.satz:first-of-type { border-top: 0; padding-top: 0; }
.satz:last-child { padding-bottom: 0; }
.satz b { font-weight: 600; }

.formreihe { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.formreihe button { display: grid; justify-items: center; gap: 6px; font-size: 12px; line-height: 14px; color: var(--text-2); min-width: 56px; text-align: center; border: 0; background: none; padding: 0; }

/* Balkenlisten */
.bl { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 44px; gap: 12px; align-items: center; min-height: 40px; width: 100%; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.bl .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bl .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl .spur { position: relative; height: 8px; }
.bl .spur .null { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--line-2); }
.bl .spur i { position: absolute; top: 0; height: 100%; border-radius: 2px; background: var(--text-3); }
.bl .spur i.f { background: var(--accent); }
.bl .w { text-align: right; font-size: 12px; font-weight: 600; }

.wertzeile { height: 20px; font-size: 13px; line-height: 20px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.diagramm { width: 100%; height: auto; touch-action: pan-y; }

/* Sheet */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 100%; max-height: calc(100dvh - 48px); border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--bg-1); color: var(--text-1); box-shadow: var(--shadow-float); overflow: hidden; }

dialog.sheet::backdrop { background: var(--scrim); }
@keyframes hoch { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-color-scheme: dark) { dialog.sheet { background: var(--bg-2); } dialog.sheet .modul, dialog.sheet .kachel { background: var(--bg-1); } }
.sheet .griff { width: 36px; height: 5px; border-radius: 3px; background: var(--bg-3); margin: 8px auto 0; flex: none; }
.sheet .skopf { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 var(--pad); flex: none; }
.sheet .skopf .titel { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .zu { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; }
.sheet .zu span { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; color: var(--text-2); }
.sheet .sinhalt { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--pad) calc(24px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) {
  dialog.sheet { margin: 0 0 0 auto; width: 480px; height: 100vh; max-height: 100vh; border-radius: 0; border-left: 1px solid var(--line-1); }
  dialog.sheet::backdrop { background: rgba(0,0,0,.2); }
  dialog.sheet[open] { animation: rein var(--t-slow) var(--ease-sheet); }
  .sheet .griff { display: none; }
}
@keyframes rein { from { transform: translateX(100%); } to { transform: none; } }
.listezeile { display: flex; align-items: center; gap: 12px; min-height: 52px; width: 100%; border: 0; background: none; text-align: left; padding: 0; border-bottom: 1px solid var(--line-1); color: inherit; }
.listezeile:last-child { border-bottom: 0; }
.listezeile .platz { width: 24px; text-align: right; font-size: 13px; color: var(--text-3); flex: none; }
.listezeile .nm { flex: 1; font-weight: 500; min-width: 0; }
.listezeile .ico { color: var(--accent); }
.listezeile .ico.t3 { color: var(--text-3); }

.leer { text-align: center; padding: 32px 8px; }
.leer .ico { width: 32px; height: 32px; color: var(--text-3); margin: 0 auto 12px; stroke-width: 1.5; }
.leer b { display: block; }
.leer p { margin: 4px auto 0; font-size: 13px; color: var(--text-2); max-width: 30em; }
.fliess { max-width: 34em; }
.fliess p { margin: 0 0 12px; }
.fliess p:last-child { margin-bottom: 0; }
.datenfuss { font-size: 12px; line-height: 16px; color: var(--text-3); margin-top: 24px; }

/* ================= Torhüterin erfassen (app/tracker.js, Klassen gk-*) ================= */
.gk-select, .gk-input { width: 100%; height: 44px; border: 1px solid var(--line-2); border-radius: var(--r-m); background: var(--bg-1); color: var(--text-1); font: 500 15px var(--font); padding: 0 12px; }
/* Newsroom: Verweis auf Instagram */
.news { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.news-ico { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--accent-tint); color: var(--accent); }
.news-ico .ico { width: 28px; height: 28px; }
.news-txt b { font-weight: 600; word-break: break-all; }
.news-txt p { margin: 4px 0 0; color: var(--text-2); }
.news .btn { white-space: nowrap; text-decoration: none; }
.news .btn .ico { width: 16px; height: 16px; }
@media (max-width: 599px) { .news { grid-template-columns: 48px minmax(0, 1fr); gap: 12px; } .news-ico { width: 48px; height: 48px; } .news .btn { grid-column: 1 / -1; width: 100%; } }
/* Karussell „Get to know the team“ */
/* Gelb abgesetzt, damit das Team auf Start heraussticht */
.karussell-modul { --gelb: #F2B705; --gelb-tint: #FFF7D6; --gelb-text: #7A5A00; border: 2px solid var(--gelb); background: linear-gradient(180deg, var(--gelb-tint), var(--bg-1) 70%); }
@media (prefers-color-scheme: dark) { .karussell-modul { --gelb: #F5C21B; --gelb-tint: #2A230B; --gelb-text: #F5C21B; } }
.karussell-modul .mkopf .micro { color: var(--gelb-text); }
.karussell-modul .kk { border-color: color-mix(in srgb, var(--gelb) 45%, var(--line-1)); background: var(--bg-1); }
.karussell-modul .kk-nr { background: var(--gelb); color: #1A1400; }
.karussell-modul .kk:focus-visible { outline-color: var(--gelb); }
.karussell { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 2px var(--pad) 4px; scroll-padding: 0 var(--pad); outline: none; }
.karussell::-webkit-scrollbar { display: none; }
.kk { flex: 0 0 200px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 14px 18px; border: 1px solid var(--line-1); border-radius: var(--r-l); background: var(--bg-0); color: inherit; min-height: 280px; transition: transform var(--t-fast); }
.kk:active { transform: scale(.98); }
.kk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kk-bild { position: relative; display: inline-block; }
.kk-nr { position: absolute; right: -6px; bottom: -2px; min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: var(--r-full); background: var(--accent); color: var(--text-on-accent); font: 700 15px/1 var(--font-display, inherit); box-shadow: 0 0 0 3px var(--bg-0); }
.kk-name { font-weight: 600; font-size: 16px; line-height: 20px; margin-top: 4px; }
.kk-pos { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.kk-satz { font-size: 13px; line-height: 18px; color: var(--text-2); font-style: italic; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.kk-pfeile { display: flex; gap: 4px; }
@media (max-width: 599px) { .kk { flex-basis: 70%; } .kk-pfeile { display: none; } }
.profiltags { display: flex; flex-wrap: wrap; gap: 6px; }
.etikett.lieb { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.etikett.lieb .ico { width: 12px; height: 12px; }
.profilsatz { margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--bg-2); border-radius: 0 var(--r-m) var(--r-m) 0; font-size: 15px; line-height: 22px; color: var(--text-1); }
.team-filter { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 12px; }
.team-filter .chip { height: 44px; padding: 0 16px; border-radius: var(--r-m); gap: 8px; }
.team-filter .chip.an { background: var(--accent-tint); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.team-filter .gk-select { border-radius: var(--r-m); border-color: var(--line-1); background: var(--bg-2); }
.team-filter .gk-select.an { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.gk-input.nr { width: 72px; flex: none; }
.gk-add { display: flex; gap: 8px; margin-top: 12px; } .gk-add .gk-input { min-width: 0; }
.gk-roster { margin: 0 calc(-1 * var(--pad)); }
.gk-row { display: grid; grid-template-columns: 24px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; padding: 4px var(--pad); cursor: pointer; }
.gk-row + .gk-row { border-top: 1px solid var(--line-1); }
.gk-row input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.gk-row .nr { font-size: 13px; color: var(--text-3); } .gk-row .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gk-row.on .nm { color: var(--text-1); } .gk-row:not(.on) .nm { color: var(--text-2); }
.gk-wide { width: 100%; height: 52px; font-size: 16px; } .gk-wide:disabled { opacity: .45; }
.gk-clock { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.gk-time { font: 650 44px/48px var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.gk-clock-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.gk-chips { display: flex; gap: 8px; flex-wrap: wrap; } .gk-chips .chip { height: 44px; padding: 0 16px; font-size: 15px; }
.gk-goal { display: block; width: 100%; max-width: 520px; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.gk-outside { fill: var(--bg-2); cursor: pointer; } .gk-outside-label { font: 600 11px var(--font); letter-spacing: .06em; text-transform: uppercase; fill: var(--text-3); pointer-events: none; }
.gk-cell rect { fill: var(--bg-1); stroke: var(--line-2); stroke-width: 1; cursor: pointer; transition: fill var(--t-fast); }
.gk-cell.on rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.gk-cell text { font: 700 13px var(--font); pointer-events: none; } .gk-cell .s { fill: var(--sieg-text); } .gk-cell .g { fill: var(--niederlage-text); } .gk-cell .sep { fill: var(--text-3); }
.gk-posts { fill: none; stroke: var(--text-1); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.gk-pick { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 32px; } .gk-pick .textaktion { margin: 0 0 0 auto; min-height: 32px; }

.gk-result .btn { height: 68px; font-size: 20px; border-radius: var(--r-l); }
.btn.save { background: var(--sieg); color: #fff; } .btn.goal { background: var(--niederlage); color: #fff; }
.gk-list { margin: 0 calc(-1 * var(--pad)); }
.gk-event { display: grid; grid-template-columns: 92px minmax(0, 1fr) 44px; align-items: center; min-height: 44px; padding: 0 4px 0 var(--pad); font-size: 14px; }
